<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{padding:70px 60px}
h1{font-size:46px;font-weight:900;letter-spacing:-1px}
.lead{font-size:26px;color:var(--ink2);margin-top:12px;line-height:1.5}
.chart{margin:50px 0 30px;display:flex;flex-direction:column;gap:34px}
.row .name{font-size:28px;font-weight:700;margin-bottom:10px}
.row .name span{font-weight:400;color:var(--ink2);font-size:23px;margin-left:8px}
.track{display:flex;align-items:center;gap:18px;border-left:2px solid var(--ink2);padding-left:0}
.bar{height:64px;background:var(--blue);border-radius:0 4px 4px 0}
.bar.base{background:#86b6ef}
.val{font-size:40px;font-weight:900;white-space:nowrap}
.save{margin-top:6px;font-size:24px;color:var(--ink2)}
.save b{color:var(--ink)}
</style></head><body>
<h1>수익 500만원, 세금은 얼마?</h1>
<div class="lead">3년간 이자·배당 등 과세 대상 수익 500만원을 낸 경우<br>(세율은 지방소득세 포함)</div>
<div class="chart">
<div class="row"><div class="name">일반 계좌 <span>15.4% 과세</span></div>
<div class="track"><div class="bar base" style="width:600px"></div><div class="val">77만원</div></div></div>
<div class="row"><div class="name">ISA 일반형 <span>200만원 비과세 + 9.9%</span></div>
<div class="track"><div class="bar" style="width:231px"></div><div class="val">29.7만원</div></div>
<div class="save">일반 계좌보다 <b>47.3만원</b> 절약</div></div>
<div class="row"><div class="name">ISA 서민형 <span>400만원 비과세 + 9.9%</span></div>
<div class="track"><div class="bar" style="width:77px"></div><div class="val">9.9만원</div></div>
<div class="save">일반 계좌보다 <b>67.1만원</b> 절약</div></div>
</div>
<div class="foot">계산 예시이며 실제 세금은 상품과 소득 구성에 따라 달라집니다.<br>국내 상장주식 매매차익은 일반 계좌에서도 비과세입니다.</div>
</body></html>
