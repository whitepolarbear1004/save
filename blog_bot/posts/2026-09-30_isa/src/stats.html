<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{padding:70px 60px}
h1{font-size:46px;font-weight:900;letter-spacing:-1px}
.lead{font-size:26px;color:var(--ink2);margin-top:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:44px 0 36px}
.tile{border:2px solid var(--line);border-radius:20px;padding:30px 30px 26px;background:#fff}
.tile.hero{grid-column:1/3;background:var(--blue-light);border-color:var(--blue-light)}
.label{font-size:25px;color:var(--ink2);font-weight:500}
.num{font-size:64px;font-weight:900;margin-top:6px;letter-spacing:-1.5px;color:var(--ink)}
.hero .num{font-size:96px;color:var(--blue-dark)}
.num small{font-size:32px;font-weight:700;margin-left:4px}
.note{font-size:23px;color:var(--ink2);margin-top:4px}
</style></head><body>
<h1>숫자로 보는 ISA 1000만 시대</h1>
<div class="lead">개인종합자산관리계좌(ISA) 현황, 2026년 8월 말</div>
<div class="grid">
<div class="tile hero"><div class="label">가입자 수</div><div class="num">1,005<small>만명</small></div><div class="note">성인 약 23%, 4명 중 1명 꼴</div></div>
<div class="tile"><div class="label">가입 금액</div><div class="num">76.5<small>조원</small></div></div>
<div class="tile"><div class="label">올해 월평균 신규</div><div class="num">약 29<small>만명</small></div></div>
<div class="tile"><div class="label">투자중개형 비중</div><div class="num">89.3<small>%</small></div><div class="note">직접 주식·ETF 투자형</div></div>
<div class="tile"><div class="label">20·30대 비중</div><div class="num">41.1<small>%</small></div><div class="note">2020년 말 32.8%</div></div>
</div>
<div class="foot">자료: 금융투자협회 (2026.9.29 발표, 언론 보도 인용)</div>
</body></html>
